# Moves each app's formula and casks to its stable release, by a pull request.
#
# The stable release is the one the app itself updates to (channels.stable in
# release.json on its repository's release branch), so the tap follows a
# release only once it is published and signed. Runs every three hours and by
# hand; by hand, one app and a version (v0.2.0) can be given.
name: Bump

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "The app; all of them if empty"
        type: choice
        options: ["", packwing, shellwing]
        required: false
      version:
        description: "A release (v0.2.0), with an app; empty for the stable one"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        app: [packwing, shellwing]
    concurrency:
      group: bump-${{ matrix.app }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.app || inputs.app == matrix.app }}

      - name: Write the formula and the casks
        id: write
        if: ${{ !inputs.app || inputs.app == matrix.app }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          VERSION: ${{ inputs.app && inputs.version || '' }}
        run: |
          version="$(python3 -I scripts/bump.py "$APP" ${VERSION:+"$VERSION"})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Open a pull request
        if: ${{ !inputs.app || inputs.app == matrix.app }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          VERSION: ${{ steps.write.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "$APP is already at $VERSION."
            exit 0
          fi
          branch="bump-$APP-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch is already open."
            exit 0
          fi
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "$APP $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "$APP $VERSION" \
            --body "$APP [v$VERSION](https://github.com/hivepaas/$APP/releases/tag/v$VERSION) is the stable release. Written by scripts/bump.py from the release's SHA-256 digests; Tests runs on this branch."
          gh workflow run tests.yml --ref "$branch"
